<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>KESMO | Free, Practical Web Tools</title>

  <meta
    name="description"
    content="Browse free, practical KESMO web tools designed to solve everyday problems with speed, clarity, and reliability."
  >

  <meta name="author" content="KESMO">
  <meta name="theme-color" content="#155eef">

  <link
    rel="canonical"
    href="https://kesmoworks.github.io/"
  >

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="KESMO">
  <meta property="og:locale" content="en_US">
  <meta property="og:title" content="KESMO | Free, Practical Web Tools">

  <meta
    property="og:description"
    content="Browse free, practical web tools designed to solve everyday problems."
  >

  <meta
    property="og:url"
    content="https://kesmoworks.github.io/"
  >

  <meta
    property="og:image"
    content="https://kesmoworks.github.io/assets/branding/kesmo-social-share.png"
  >

  <meta
    property="og:image:alt"
    content="KESMO — Precision made simple."
  >

  <!-- X continues to use the established Twitter Card metadata names. -->
  <meta name="twitter:card" content="summary_large_image">

  <meta
    name="twitter:title"
    content="KESMO | Free, Practical Web Tools"
  >

  <meta
    name="twitter:description"
    content="Browse free, practical web tools designed to solve everyday problems."
  >

  <meta
    name="twitter:image"
    content="https://kesmoworks.github.io/assets/branding/kesmo-social-share.png"
  >

  <meta
    name="twitter:image:alt"
    content="KESMO — Precision made simple."
  >

  <link
    rel="icon"
    href="assets/branding/favicon.svg"
    type="image/svg+xml"
  >

  <link rel="stylesheet" href="styles.css">

  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "KESMO",
      "description": "Free, practical web tools designed to solve everyday problems.",
      "url": "https://kesmoworks.github.io/",
      "publisher": {
        "@type": "Organization",
        "name": "KESMO",
        "url": "https://kesmoworks.github.io/",
        "logo": {
          "@type": "ImageObject",
          "url": "https://kesmoworks.github.io/assets/branding/logo.svg"
        }
      }
    }
  </script>

  <script src="components.js" defer></script>
  <script src="script.js" defer></script>
</head>

<body>
  <div id="site-header"></div>

  <main id="main-content">
    <div
      id="page-hero"
      data-eyebrow="Precision made simple."
      data-title="Free, practical web tools."
      data-description="Browse the KESMO collection of simple, reliable web tools designed to solve everyday problems."
    ></div>

    <section
      class="content-section"
      aria-labelledby="tools-heading"
    >
      <div class="page-container content-container">
        <div class="section-heading">
          <p class="section-label">
            Tools
          </p>

          <h2 id="tools-heading">
            Available tools
          </h2>
        </div>

        <div class="feature-grid">
          <article class="feature-card">
            <h3>
              KESMO Pricing Calculator
            </h3>

            <p>
              Estimate a profitable selling price based on your costs,
              marketplace fees, and desired profit.
            </p>

            <p>
              <a
                class="button button-primary"
                href="https://kesmoworks.github.io/pricing-calculator/"
              >
                Open Pricing Calculator
              </a>
            </p>
          </article>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <noscript>
    <div class="noscript-message">
      This website works without JavaScript, but shared navigation
      may be unavailable.
    </div>
  </noscript>
</body>
</html>
